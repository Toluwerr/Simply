name: Simply RSI Loop

# Simply improves itself on a schedule, then commits its progress back
# to this repository. Everything runs on GitHub's servers - no local
# machine needed.
#
# The repo is PUBLIC, so Actions minutes are free and unlimited: the
# loop runs every 30 minutes (off-peak :17/:47 for scheduler reliability)
# and each run performs 12 self-improvement iterations = 1 commit each.
# 48 runs/day x 12 commits = 576 planned commits/day (~500+ after
# real-world scheduler skips) - roughly 183,000+ commits per year.

on:
  schedule:
    - cron: '17,47 * * * *'
  workflow_dispatch:
    inputs:
      iterations:
        description: 'Number of RSI iterations to run'
        default: '12'

concurrency:
  group: simply-rsi
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  improve:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install PyTorch (CPU)
        run: pip install torch --index-url https://download.pytorch.org/whl/cpu

      - name: Run self-improvement
        run: python self_improve.py --iterations "${{ inputs.iterations || 12 }}" --steps 200 --synth-batches 3

      - name: Ensure progress is committed
        run: |
          git config user.name "Simply RSI Bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -m "Simply RSI run $(date -u '+%Y-%m-%d %H:%M') - see IMPROVEMENT_LOG.md"
          git push
